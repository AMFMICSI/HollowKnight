buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
    classpath "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

task packTextures {
    dependsOn buildscript.configurations.classpath
    def animDir = file("assets/animation")
    def outputDir = file("assets/animation")
    inputs.dir animDir
    outputs.file file("$outputDir/knight.atlas")
    outputs.file file("$outputDir/knight.png")
    doLast {
        def tmpDir = new File(project.buildDir, "tmp/knight-frames")

        // Clean and recreate temp directory
        delete tmpDir
        tmpDir.mkdirs()

        // Copy only individual frame PNGs (those with _NNN pattern), skip combined spritesheets
        animDir.eachFileMatch(~".*_\\d{3}\\.png") { file ->
            copy {
                from file
                into tmpDir
            }
        }

        // Pack only the knight frames
        def settings = new com.badlogic.gdx.tools.texturepacker.TexturePacker.Settings()
        settings.maxWidth = 4096
        settings.maxHeight = 4096
        settings.alias = false
        settings.pot = false
        settings.bleed = false
        settings.useIndexes = false
        settings.duplicatePadding = true
        settings.edgePadding = false
        com.badlogic.gdx.tools.texturepacker.TexturePacker.process(settings,
            tmpDir.absolutePath, outputDir.absolutePath, "knight")
    }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 17

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'HollowKnight'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'HollowKnight' + '-parent'
